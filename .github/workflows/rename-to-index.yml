name: Rename demo to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv american-current-website-demo.html index.html
          git config user.name "americancurrent"
          git config user.email "americancurrent@users.noreply.github.com"
          git add index.html american-current-website-demo.html
          git commit -m "Rename demo file to index.html"
          git push
